# Apache Virtual Host Configuration for BitBio Django
# Place this in your Apache sites-available directory and enable it

<VirtualHost *:80>
    ServerName member.bit.bio
    DocumentRoot /home/memberbit/public_html
    
    # Static files configuration
    Alias /static/ /home/memberbit/public_html/staticfiles/
    <Directory /home/memberbit/public_html/staticfiles>
        Require all granted
        # Cache static files for better performance
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType font/woff "access plus 1 month"
        ExpiresByType font/woff2 "access plus 1 month"
        ExpiresByType application/font-woff "access plus 1 month"
        ExpiresByType application/font-woff2 "access plus 1 month"
    </Directory>
    
    # Media files configuration (if you have user uploads)
    Alias /media/ /home/memberbit/public_html/media/
    <Directory /home/memberbit/public_html/media>
        Require all granted
    </Directory>
    
    # Django application configuration
    <Directory /home/memberbit/public_html>
        <Files passenger_wsgi.py>
            Require all granted
        </Files>
        RewriteEngine On
        # Handle static files first
        RewriteCond %{REQUEST_URI} ^/static/
        RewriteRule ^static/(.*)$ /staticfiles/$1 [L]
        # Handle media files
        RewriteCond %{REQUEST_URI} ^/media/
        RewriteRule ^media/(.*)$ /media/$1 [L]
        # Pass all other requests to Django
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ passenger_wsgi.py [QSA,L]
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    
    # Logging
    ErrorLog /var/log/apache2/bitbio_error.log
    CustomLog /var/log/apache2/bitbio_access.log combined
</VirtualHost>

# HTTPS configuration (recommended for production)
<VirtualHost *:443>
    ServerName member.bit.bio
    DocumentRoot /home/memberbit/public_html
    
    # SSL configuration
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    
    # Static files configuration (same as HTTP)
    Alias /static/ /home/memberbit/public_html/staticfiles/
    <Directory /home/memberbit/public_html/staticfiles>
        Require all granted
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType font/woff "access plus 1 month"
        ExpiresByType font/woff2 "access plus 1 month"
        ExpiresByType application/font-woff "access plus 1 month"
        ExpiresByType application/font-woff2 "access plus 1 month"
    </Directory>
    
    # Media files configuration
    Alias /media/ /home/memberbit/public_html/media/
    <Directory /home/memberbit/public_html/media>
        Require all granted
    </Directory>
    
    # Django application configuration
    <Directory /home/memberbit/public_html>
        <Files passenger_wsgi.py>
            Require all granted
        </Files>
        RewriteEngine On
        # Handle static files first
        RewriteCond %{REQUEST_URI} ^/static/
        RewriteRule ^static/(.*)$ /staticfiles/$1 [L]
        # Handle media files
        RewriteCond %{REQUEST_URI} ^/media/
        RewriteRule ^media/(.*)$ /media/$1 [L]
        # Pass all other requests to Django
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ passenger_wsgi.py [QSA,L]
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Logging
    ErrorLog /var/log/apache2/bitbio_ssl_error.log
    CustomLog /var/log/apache2/bitbio_ssl_access.log combined
</VirtualHost>
