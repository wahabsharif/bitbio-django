# docker-compose.prod.yml

services:
  web:
    build: .
    container_name: bitbio_web_prod
    restart: always
    env_file:
      - .env
    network_mode: "host"
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.mysql}
      - DB_NAME=${DB_NAME:-memberbit_bitbio}
      - DB_USER=${DB_USER:-memberbit_bitbio}
      - DB_PASSWORD=${DB_PASSWORD:-7FwNC8uxK)PUx~To}
      - DB_HOST=localhost
      - DB_PORT=3306
      - SECRET_KEY=${SECRET_KEY:-django-insecure-z45x*8#9292((t56%@@p&k7(ao!g-^w}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-member.bit.bio,bitbiohost.uksouth.cloudapp.azure.com,rdg.capture.dev.workplaceservicing.co.uk,rdg.capture.dev.workplaceservicing.co.uk.,fs.capture.dev.workplaceservicing.co.uk,fs.capture.dev.workplaceservicing.co.uk.,localhost,127.0.0.1}
      - STATIC_URL=${STATIC_URL:-/static/}
      - MEDIA_URL=${MEDIA_URL:-/media/}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - USE_X_FORWARDED_HOST=True
      - USE_X_FORWARDED_PORT=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      # PDF generation environment variables
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
      - XDG_RUNTIME_DIR=/tmp
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/dev/null
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      # Mount static files to Apache document root for direct serving
      - static_volume:/home/memberbit/public_html/static
      - media_volume:/home/memberbit/public_html/media
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.5'
        reservations:
          memory: 2G
          cpus: '2'
    command: >
      sh -c "pkill -f 'Xvfb.*:99' || true &&
             rm -f /tmp/.X99-lock || true &&
             Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
             sleep 2 &&
             python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 9 --worker-class sync --max-requests 1000 --max-requests-jitter 100 --timeout 120 --keep-alive 5 --worker-tmp-dir /dev/shm bitbio.wsgi:application"



volumes:
  static_volume:
  media_volume:
  logs_volume:

