services:
  web:
    build: .
    container_name: bitbio_web_prod
    restart: always
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - STATIC_URL=${STATIC_URL}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE}
      # PDF generation environment variables
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
      - XDG_RUNTIME_DIR=/tmp
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/dev/null
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      - redis
    networks:
      - bitbio_prod_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command: >
      sh -c "pkill -f 'Xvfb.*:99' || true &&
             rm -f /tmp/.X99-lock &&
             mkdir -p /app/logs && chmod 755 /app/logs &&
             Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 bitbio.wsgi:application"

  nginx:
    image: nginx:alpine
    container_name: bitbio_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - bitbio_prod_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: bitbio_redis_prod
    restart: always
    networks:
      - bitbio_prod_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  static_volume:
  media_volume:
  logs_volume:

networks:
  bitbio_prod_network:
    driver: bridge
