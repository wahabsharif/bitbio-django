# docker-compose.prod.yml

services:
  web:
    build: .
    container_name: bitbio_web_prod
    restart: always
    network_mode: "host"
    environment:
      # Debug Settings
      - DEBUG=False
      
      # Database Configuration
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=memberbit_bitbio
      - DB_USER=memberbit_bitbio
      - DB_PASSWORD=7FwNC8uxK)PUx~To
      - DB_HOST=localhost
      - DB_PORT=3306
      
      # Security Settings
      - SECRET_KEY=django-insecure-z45x*8#9292((t56%@@p&k7(ao!g-^w}
      - ALLOWED_HOSTS=member.bit.bio,bitbiohost.uksouth.cloudapp.azure.com,rdg.capture.dev.workplaceservicing.co.uk,rdg.capture.dev.workplaceservicing.co.uk.,fs.capture.dev.workplaceservicing.co.uk,fs.capture.dev.workplaceservicing.co.uk.,localhost,127.0.0.1
      
      # Static and Media Files
      - STATIC_URL=/static/
      - MEDIA_URL=/media/
      
      # Security Cookies (for HTTPS)
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      
      # Email Configuration
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=465
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=True
      - EMAIL_HOST_USER=no-reply@bit.bio
      - EMAIL_HOST_PASSWORD=puib eyna hnwv yicc
      - DEFAULT_FROM_EMAIL=no-reply@bit.bio
      - SERVER_EMAIL=no-reply@bit.bio
      
      # Shopify API Configuration
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN}
      - SHOPIFY_STOREFRONT_ACCESS_TOKEN=${SHOPIFY_STOREFRONT_ACCESS_TOKEN}
      - SHOPIFY_SHOP_DOMAIN=${SHOPIFY_SHOP_DOMAIN:-bit-bio.myshopify.com}
      - SHOPIFY_PRIMARY_DOMAIN=${SHOPIFY_PRIMARY_DOMAIN:-shop.bit.bio}
      - SHOPIFY_SCOPES=${SHOPIFY_SCOPES:-read_customers,write_customers,read_orders}
      
      # Admin Settings
      - ADMIN_SITE_HEADER=🧬 BitBio Administration
      - ADMIN_SITE_TITLE=BitBio Admin Portal
      - ADMIN_INDEX_TITLE=Welcome to BitBio Administration
      - ADMIN_LOGIN_REDIRECT_URL=/admin/
      - ADMIN_LOGOUT_REDIRECT_URL=/
      
      # Session Settings
      - SESSION_COOKIE_AGE=3600
      - SESSION_EXPIRE_AT_BROWSER_CLOSE=True
      
      # Cache Settings
      - CACHE_TIMEOUT=600
      
      # Internationalization
      - LANGUAGE_CODE=en-us
      - TIME_ZONE=UTC
      - USE_I18N=True
      - USE_TZ=True
      
      # Login URL
      - LOGIN_URL=/
      
      # Proxy Settings
      - USE_X_FORWARDED_HOST=True
      - USE_X_FORWARDED_PORT=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      
      # PDF generation environment variables
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - DISPLAY=:99
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
      - XDG_RUNTIME_DIR=/tmp
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/dev/null
    volumes:
      - logs_volume:/app/logs
      # Bind mount host directories for Apache to serve static files directly
      - /home/memberbit/public_html/static:/app/apache_static
      - /home/memberbit/public_html/media:/app/apache_media
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.5'
        reservations:
          memory: 2G
          cpus: '2'
    command: >
      sh -c "pkill -f 'Xvfb.*:99' || true &&
             rm -f /tmp/.X99-lock || true &&
             Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
             sleep 2 &&
             python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             echo 'Copying static files to Apache directory...' &&
             cp -r /app/staticfiles/* /app/apache_static/ 2>/dev/null || true &&
             cp -r /app/media/* /app/apache_media/ 2>/dev/null || true &&
             echo 'Static files copied successfully!' &&
             gunicorn --bind 0.0.0.0:8000 --workers 9 --worker-class sync --max-requests 1000 --max-requests-jitter 100 --timeout 120 --keep-alive 5 --worker-tmp-dir /dev/shm bitbio.wsgi:application"

volumes:
  logs_volume:

