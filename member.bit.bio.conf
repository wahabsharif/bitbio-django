<VirtualHost *:80>
    ServerName member.bit.bio
    DocumentRoot /home/memberbit/public_html
    
    # Enable mod_proxy
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Serve static files directly from Apache for better performance
    Alias /static /home/memberbit/public_html/static
    Alias /media /home/memberbit/public_html/media
    
    <Directory "/home/memberbit/public_html/static">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </Directory>
    
    <Directory "/home/memberbit/public_html/media">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 week"
    </Directory>
    
    # Proxy all other requests to Django
    ProxyPass /static !
    ProxyPass /media !
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/
    
    # Set headers for Django
    ProxyPassReverse / http://localhost:8000/
    ProxyPassReverseMatch ^(/.*) http://localhost:8000$1
    
    # Headers for proper forwarding
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "http"
    
    ErrorLog /var/log/apache2/member.bit.bio_error.log
    CustomLog /var/log/apache2/member.bit.bio_access.log combined
</VirtualHost>

# HTTPS Configuration (if you have SSL certificates)
<VirtualHost *:443>
    ServerName member.bit.bio
    DocumentRoot /home/memberbit/public_html
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key
    # SSLCertificateChainFile /path/to/your/chain.crt  # if needed
    
    # Enable mod_proxy
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Serve static files directly from Apache for better performance
    Alias /static /home/memberbit/public_html/static
    Alias /media /home/memberbit/public_html/media
    
    <Directory "/home/memberbit/public_html/static">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </Directory>
    
    <Directory "/home/memberbit/public_html/media">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 week"
    </Directory>
    
    # Proxy all other requests to Django
    ProxyPass /static !
    ProxyPass /media !
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/
    
    # Headers for proper forwarding
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Forwarded-Proto "https"
    
    ErrorLog /var/log/apache2/member.bit.bio_ssl_error.log
    CustomLog /var/log/apache2/member.bit.bio_ssl_access.log combined
</VirtualHost>
